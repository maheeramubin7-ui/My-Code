<!DOCTYPE html>
<html>
    <h2>Javascript Arrays</h2>
    <p id="demo"></p>
<body>
<h2>Javascript Array Method</h2>
<h2>Join() and pop()</h2>
<p>The join() method joins array elements into a string and the pop() method removes the last element from an arrow</p>
<p id="myjoin"></p>
<p id="myfirstpop"></p>
<p id="mysecondpop"></p>
 <script>
    var fruits = ["Banana", "Orange", "Apple", "Mango"];
    document.getElementById("myjoin").innerHTML = fruits.join(" * ");
    document.getElementById("myfirstpop").innerHTML = fruits;fruits.pop();
    document.getElementById("mysecondpop").innerHTML = fruits;
 </script>   
 <script>  var cars=[
            "Coding",
            "Magic",
            "Learn",
    ];
    document.getElementById("demo").innerHTML = cars[2];</script>
 </body>
</html>
