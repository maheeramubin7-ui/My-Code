<!DOCTYPE html>
<html>
    <head>
        <title>Javascript Math Object Method</title>
    </head>
    <body>
        <h2>Sum of Arguments</h2>
        <p id="result"></p>
        <script type="text/javascript">
           var value = Math.sin(45);
           document.write("sin 45 is : " + value + "<br>");
           var value1 = Math.cos(45);
           document.write("cos 45 is : " + value1 + "<br>");
           var value2 = Math.tan(45);
           document.write("tan 45 is : " + value2 + "<br>");
           
           function findSum() {
                var i;
                var sum = 0;
                for(i = 0; i < arguments.length; i++){
                if (arguments[i] > sum) {
                sum = arguments[i];    
                }
                }
                return sum;
                }
                document.getElementById("result").innerHTML = findSum(4 + 5 + 6);
        </script>
    </body>
</html>
