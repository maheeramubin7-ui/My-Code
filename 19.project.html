<!DOCTYPE html>
<html>
    <body>
        <h2>Picking Random Number</h2>
        <p id="number"></p>
        
        <script>
            var text = "";
            var i = 0;
            while (i < 10) {
            var randomNumber = Math.floor(Math.random() * 100) + 1;
                text += "<br>Random number" + (i + 1) + "is: "+ randomNumber;
                i++
            }
            document.getElementById("number").innerHTML = text;
        </script>
    </body>
</html>
