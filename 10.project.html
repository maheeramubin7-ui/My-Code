<!DOCTYPE html>
<html>
    <head>
        <title>Bookstrap Grids</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        <style>
            .col{
               text-align: center; 
               border:1px solid black;
            }
        </style>          
    </head>
    <body>
        <h1>Unequal Grids</h1>
        <div class="container">
               <div class="col">
                  Coloumn 1
               </div>
               <div class="col">
                  Coloumn 2
               </div>
               <div class="col">
                  Coloumn 3
               </div>
               </div>
        <h1>Equal Grids</h1>
        <div class="container">
            <div class="row">
                <div class="col">
                    Coloumn 1
                </div>
                <div class="col">
                    Coloumn 2
                </div>
                <div class="col">
                    Coloumn 3
                </div>
            </div>
        </div>
    </body>
</html>
