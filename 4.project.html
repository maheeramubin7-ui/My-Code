<!DOCTYPE html>
<html>
    <head>
        <title>Personal Survey</title>
    </head>
    <body>
       <h1>Personal Information</h1> 
       <form>
        <fieldset>
            <h2><legend style="text-align:center"><b>Details Form</b></legend></h2>
            <label>Name</label><br>
            <input type="text" id="name"><br><br>
            <label>Email</label><br>
            <input type="text" id="email"><br><br>
            <label>Contact number</label><br>
            <input type="password" id="contact"><br><br>
            <label>Age Group</label><br>
            <select type="age" id="age">
                <option value="Below 18">Below 18</option>
                <option value="18-24">18-24</option>
                <option value="25-34">25-34</option>
                <option value="35+">35+</option>
            </select><br><br>
            <label>Gender</label><br>
            <input type="radio" id="female" name="Gender" value="female">Female<br>
            <input type="radio" id="male" name="Gender" value="male">Male<br>
            <input type="radio" id="Other" name="Gender" value="Other">Other<br>
            <input type="radio" id="no" name="Gender" value="no">Prefer not to say<br><br>
            <label>Country</label><br>
            <select type="country" id="country">
                <option value="Bangladesh">Bangladesh</option>
                <option value="india">India</option>
                <option value="USA">USA</option>
                <option value="UK">UK</option>
                <option value="Other">Other</option>
            </select><br><br>
            <label>Hobby</label><br>
                <input type="checkbox" id="Reading" name="hobby" value="Reading">Reading<br>
                <input type="checkbox" id="Gardening" name="hobby" value="Gardening">Gardening<br>
                <input type="checkbox" id="Travelling" name="hobby" value="Travelling">Travelling<br>
                <input type="checkbox" id="Gaming" name="hobby" value="Gaming">Gaming<br>
                <input type="checkbox" id="Other" name="hobby" value="Other">Other<br><br>
                <input type="Submit">
        </fieldset>
       </form>
    </body>
</html>
