<!DOCTYPE html>
<html>
    <head>
        <title>Transform</title>
        <style>
        div{
            width:300px;
            height:200px;
            background-color: rgb(108, 108, 155);
            border:1px rgb(89, 170, 124);
        }
        #myDiv{
            transform:rotateX(180deg);
        }
    </style>
    </head>
    <body>
        <h1>Welcome to coodingal</h1>
        <p>Ready to learn the rotate method</p>
        <div>
            Coodingal
        </div>
        <div id="myDiv">
            Coodingal
        </div>
    </body>
    
</html>
