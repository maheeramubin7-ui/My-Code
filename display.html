<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Bookstrap Typography</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    </head>
    <body>
        <div class="container">
            <h1>Heading Lists</h1>
            <h1 class="display-1">Codingal</h1>
            <h1 class="display-2">Codingal</h1>
            <h1 class="display-3">Codingal</h1>
            <h1 class="display-4">Codingal</h1>
        </div>
        <div class="container">
            <h1>Lighter, Secondary text with small tag
            <small class="text-muted">Hello Codinhal</small>
            </h1>
            <dl>
                <dt>Coffee</dt>
                <dd>White Hot Drink</dd>
            </dl>
        </div>
    </body>
</html>
