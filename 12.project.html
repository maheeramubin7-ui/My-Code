<!DOCTYPE html>
<html>
    <head>
        <title>Pagination</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, iniyial-scale=1">
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    </head>
    <body>
        <div class="container">
            <h2>Pagination</h2>
            <p>Fall in love with coding</p>
            <!-- Declarw the pagination class -->
             <ul class="pagination">
                <!-- Declare the item in the group-->
                 <li class="page-item">
                    <!-- Declare the link of the item -->
                     <a class="page-link" href="#">Previous</a>
                 </li>
                 <!-- Rest of the pagination items -->
                  <li class="page-item">
                    <a class="page-link" href="#">1</a>
                  </li>
                  <li class="page-item">
                    <a class="page-link" href="#">2</a>
                  </li>
                  <li class="page-item">
                    <a class="page-link" href="#">3</a>
                  </li>
                  <li class="page-item">
                    <a class="page-link" href="#">Next</a>
                  </li>
             </ul>
        </div>
        <h1 style="color:orange; text-align:center;">
            Codingal
        </h1>
        <div class="container">
        <div class="card" style="width:18rem;">
            <img class="card-img-top" src="https://codeskulptor-demos.commondatastorage.googleapis.com/GalaxyInvaders/back07.jpg">
        </div>
        <div class="card-body">
            <h5 class="card-title">User Name</h5>
            <p class="card-text">Passionate about programming</p>
            <a href="#" class="btn btn-primary">See Profile</a>
        </div>
        </div>
        <div class="container">
            <h2>Spinners</h2>
            <p>To create a spinner/loader, use the <code>.spinner-border</code>class:</p>
            <div class="spinner-border"></div>
        </div>
    </body>
    </html>
