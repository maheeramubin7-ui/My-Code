<!DOCTYPE html>
<html>
    <head>
        <tittle>Box Model Properties</tittle>
        <style type="text/css">
           .example1{
            width:200px;
            background-color: rgb(92, 197, 162);
            padding:20px;
            border:3px;
            margin:0px;
           }
           .example2{
            width:220px;
            background-color: rgb(69, 187, 69);
            padding:20px;
            border:3px rgb(175, 110, 63);
            margin:30px 20px;
           }
           hr{
            background-color: rgb(211, 75, 75);
           }
           img#flowerRight{
            float:Right;
           }
           img#flowerLeft{
            float:Left;
           }
        </style>
    </head>
    <body>
        <h1>Box Model</h1>
        <hr>
        <p class="example1">Hello Everyone!</p>
        <hr style="width:10%; height:10px; color:rgb(187, 141, 72);">
        <p class="example2">Today is Friday.</p>
        <hr style="width:20%; height:1px; color:rgb(115, 67, 160);">
        <br><br><br><br><br><br>
        <h1>Float</h1>
        <p>This is the example of float. Two images can be seen on both sides.</p>
        <p>
            <img id="flowerRight" src="flower.webp" alt="Error"
        style="width:100px; height:100px;">
            <img id="flowerLeft" src="flower.webp" alt="Error"
        style="width:100px; height:100px;">
        </p>
         <br><br><br><br><br><br>
    </body>
</html>
