<!DOCTYPE html>
<html>
    <head>
        <title>Positioning</title>
        <style>
            .sticky{
                position:sticky;
                top:1px;
                left:10px;
                background-color: rgb(77, 77, 224);
                border:2px black;
                padding:4px;
                font-size: :20px;
;            }
            .relative{
                position:relative;
                top:20px;
                right:20px;
                border:32px rgb(187, 61, 61);
                padding:6px;
            }
            .absolute{
                position:absolute;
                top:355px;
                left:20px;
                border:1px greenyellow;
                padding:4px;
            }
            .fixed{
                position:fixed;
                bottom:0px;
                right:0px;
                border:2px rgb(209, 77, 77);
                padding:4px;
            }
        </style>
    </head>
    <body>
        <h1>Positioning Example</h1>
        <div>
            with no position property
        </div>
        <div class="sticky">
            with sticky property
        </div>
        <div class="relative">
            with relative property
        </div>
        <div class="absolute">
            with absolute property
        </div>
        <div class="fixed">
            with fixed property
        </div>
        <br><br><br><br><br><br><br><br><br><br><br><br>
        <br><br><br><br><br><br><br><br><br><br><br><br>
        <br><br><br><br><br><br><br><br><br><br><br><br>
        <br><br><br><br><br><br><br><br><br><br><br><br>
        <br><br><br><br><br><br><br><br><br><br><br><br>
    </body>
</html>
