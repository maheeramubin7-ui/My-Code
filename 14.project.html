<!DOCTYPE html>
<html>
    <head>
        <title>Portfolio</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width. initial-scale=1">
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
        <style>
            body{
                position: relative;
            }
            p{
                font-size: 18px;
            }
            #section1 {padding-top:50px;height:500px;color: white; background-color:blue;}
            #section2 {padding-top:50px;height:500px;color: green; background-color:white;}
        </style>
    </head>
    <body>
        <div class="container">
            <h2>Carousel</h2>
            <div id="myCarousel" class="carousel slide" data-ride="carousel">
                <!-- Indicators -->
                 <ol class="carousel-indicators">
                    <li data-target="#myCarousel" data-slide-to="0" class="active"></li>
                    <li data-target="#myCarousel" data-slide-to="1"></li>
                    <li data-target="#myCarousel" data-slide-to="2"></li>
                 </ol>
                 <!-- wrapper for slides -->
                  <div class="carousel-inner">
                    <div class="item active">
                        <img src="solar system.webp" alt="Image 1">
                    </div>
                    <div class="item">
                        <img src="northern lights.jpg" alt="Image 2">
                    </div>
                    <div class="item">
                        <img src="dog.avif" alt="image 3">
                    </div>
                  </div>
                  <!-- Left and right controls -->
                   <a class="right carousel-control" href="#myCarousel" data-slide="next">
                    <span class="glyphicon glyphicon-chevron-right"></span>
                    <span class="sr-only">Next</span>
                   </a>
                   <a class="left carousel-control" href="#myCarousel" data-slide="prev">
                    <span class="glyphicon glyphicon-chevron-left"></span>
                    <span class="sr-only">Previous</span>
                   </a>
            </div>
        </div>
        <h1>Scrollspy</h1>
        <body data-spy="scroll" data-target=".navbar" data-offset="50">
            <nav class="navbar navbar-inverse navbar-fixed-top">
                <div class="container-fluid">
                    <div class="navbar-header">
                        <button type="button" class="navbar-toggle" data-toggle="collapse" dataa-target="#myNavbar">
                            <span class="icon-bar"></span>
                            <span class="icon-bar"></span>
                            <span class="icon-bar"></span>
                        </button>
                        <a class="navbar-brand" href="#">Codingal</a>
                    </div>
                </div>
                <div class="collapse navbar-collapse" id="myNavbar">
                    <ul class="nav navbar-nav">
                        <li><a href="#section1">Section 1</a></li>
                        <li><a href="#section1">Section 2</a></li>
                    </ul>
                </div>
            </nav>
            <div id="section1" class="container-fluid">
                <h1>Section 1</h1>
                <h3>Codingal</h3>
                <h5>Codingal is on a mission to inspire school kids to fall in love with codingal. Codingal is proven to develop creativity, logical thinking and problem solving skills in kids.</h6>
                <p>Scroll this section.</p>
            </div>
        </body>
    </body>
</html>
