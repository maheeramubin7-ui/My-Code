<!DOCTYPE html>>
<html>
    <head>
        <title>Positioning in CSS</title>
        <style>
          .sticky{
            position:sticky;
            top:1px;
            left:10px;
            background-color:rgb(58, 199, 58);
            border:2px black;
            padding:4px;
            font-size:20px;
            opacity:0.3;
          }
          .relative{
            position:relative;
                top:1px;
                right:5px;
                border:34px rgb(187, 81, 81);
                padding:7px;
                opacity: 0.5;
          }
          .absolute{
            position:absolute;
            top:322px;
            left:20px;
            background-color: rgb(61, 141, 114);
            border:32px rgb(4, 48, 48);
            padding:5px;
            opacity:0.8;
          }
          .fixed{
            position:fixed;
            bottom:0px;
            right:0px;
            background-color: rgb(238, 188, 114);
            border:20px rgb(145, 92, 23);
            padding:5px;
            opacity:1;
          }
        </style>
    </head>
    <body>
        <h1>Positioning</h1>
         <div>
            Shadow Strike
        </div>
        <div
            class="relative">
            Welcome to the battlezone
        </div>
        <div
            class="sticky">
            Featured Game: Cyber Strike
        </div>
        <div
            class="absolute">
            Join Now
        </div>
        <div
            class="fixed">
            Leave
        </div>
        <br><br><br><br><br><br><br><br><br><br><br><br>
        <br><br><br><br><br><br><br><br><br><br><br><br>
        <br><br><br><br><br><br><br><br><br><br><br><br>
        <br><br><br><br><br><br><br><br><br><br><br><br>
        <br><br><br><br><br><br><br><br><br><br><br><br>
    </body>
</html>
