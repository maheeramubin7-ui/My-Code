<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>CSS Box Mode</title>
        <style type="text/css">
        .example1{
            width:220px;
            background-color:aqua;
            padding:20px;
            border:3px;
            margin:0px;
        }
        .example2{
            width:220px;
            background-color:rgb(120, 78, 160);
            padding:20px;
            border:3px solid black;
            margin:30px 20px;
        }
        hr{
            background-color:rgb(167, 70, 70);
        }
        </style>
    </head>
    <body>
        <h1>Box Model Example</h1>
        <hr>
        <p class="example1">My Content Example 1</p>
        <hr style="width:10px; height:10px; color:rgb(84, 84, 175);">
        <p class="example2">My Content Example 2 </p>
        <hr style="width:20px; height:1px; color:rgb(184, 139, 71);">
    </body>
</html>
