<!DOCTYPE html>
<html>
    <head>
        <title>Float example</title>
        <style>
            img#flowerRight{
                float:right
            }
            img#flowerleft{
                float:left
            }
            </style>
    </head>
    <body>
        <h2>Float Right</h2>
        <p>In this example, the image will float to the right in the paragraph, and the text in the paragraph will wwrap around the image.</p>
        <p>
            <img id="flowerRight" src="flower.webp" alt="Error"
        style="width:100px;height:100px;">
            <img id="flowerleft" src="flower.webp" alt="Error"
        style="width:100px;height:100px;">
        This is a dummy content used to understand float property.
        </p>
    </body>
</html>
